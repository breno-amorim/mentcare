<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MentCare — Saúde mental mais acessível</title>
<style>
:root{--bg:#f5f7fb;--surface:#fff;--ink:#17233b;--muted:#718096;--line:#e5eaf2;--primary:#5367d9;--primary2:#4053c2;--mint:#e5f6f0;--green:#218566;--rose:#fff0f0;--red:#c34e58;--amber:#fff5df;--shadow:0 10px 30px #26375b0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1180px)/2));position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:20px;letter-spacing:-.5px}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#6879ed,#49b99b);display:grid;place-items:center;color:#fff;font-size:20px}.topright{display:flex;align-items:center;gap:12px}.shell{max-width:1180px;margin:30px auto;padding:0 24px 60px}.layout{display:grid;grid-template-columns:230px 1fr;gap:26px}.sidebar{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;height:max-content;position:sticky;top:94px}.side-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#9aa5b6;font-weight:800;padding:8px 10px}.nav{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border:0;border-radius:10px;background:transparent;color:#536078;text-align:left;margin:2px 0}.nav:hover,.nav.active{background:#eef0ff;color:var(--primary);font-weight:700}.nav span{width:20px;text-align:center}.content{min-width:0}.welcome{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.eyebrow{font-size:12px;color:var(--primary);font-weight:800;text-transform:uppercase;letter-spacing:1px}.welcome h1{font-size:29px;letter-spacing:-1px;margin:4px 0}.muted{color:var(--muted)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(3,1fr);margin-bottom:20px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:var(--shadow)}.stat small{color:var(--muted);font-weight:600}.stat strong{display:block;font-size:27px;margin-top:6px}.stat-icon{float:right;width:36px;height:36px;border-radius:12px;background:#eef0ff;display:grid;place-items:center}.two{grid-template-columns:1.2fr .8fr}.card h2{font-size:17px;margin:0 0 14px}.card h3{font-size:15px;margin:0 0 5px}.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--primary);color:#fff;font-weight:700}.btn:hover{background:var(--primary2)}.btn.secondary{background:#eef0ff;color:var(--primary)}.btn.ghost{background:#f3f5f9;color:#526078}.btn.danger{background:#fff0f0;color:var(--red)}.btn.small{font-size:13px;padding:7px 10px}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:12px}.item{padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0;padding-bottom:0}.pill{display:inline-flex;padding:4px 9px;border-radius:99px;font-size:11px;font-weight:800;background:#eef0ff;color:var(--primary)}.pill.green{background:var(--mint);color:var(--green)}.pill.amber{background:var(--amber);color:#9a6b16}.pill.red{background:var(--rose);color:var(--red)}.clinic{display:grid;grid-template-columns:52px 1fr auto;gap:13px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line)}.clinic:last-child{border:0}.clinic-icon{height:48px;width:48px;border-radius:14px;background:#eaf5f4;display:grid;place-items:center;font-size:23px}.clinic-meta{font-size:12px;color:var(--muted);margin-top:4px}.filters{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:10px;margin:16px 0}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;color:#56647a;font-weight:800}.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid #dce2ec;border-radius:9px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px #5367d91c}.field textarea{min-height:90px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.formgrid .wide{grid-column:1/-1}.empty{text-align:center;padding:30px 15px;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-bottom:5px}.notice{padding:12px 14px;background:#f0f3ff;border-radius:10px;color:#4c5ab4;font-size:12px;margin:12px 0}.warning{padding:12px 14px;background:#fff7e7;border:1px solid #f4e4bf;border-radius:10px;color:#86621e;font-size:12px;margin:12px 0}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);vertical-align:top}.table th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}.modalback{position:fixed;inset:0;background:#17233b77;z-index:20;display:grid;place-items:center;padding:18px}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:24px;box-shadow:0 25px 80px #101a3555}.modal h2{margin:0 0 16px}.modalfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}.stars{color:#e3a62c;letter-spacing:2px}.loginwrap{max-width:960px;margin:70px auto;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}.loginhero{padding:30px}.loginhero h1{font-size:42px;line-height:1.1;letter-spacing:-1.5px}.loginpanel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow)}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{border:0;background:#f2f4f8;padding:9px 14px;border-radius:9px;color:#657188;font-weight:700}.tab.active{background:#eef0ff;color:var(--primary)}.footer{font-size:11px;color:#9aa5b6;text-align:center;margin-top:25px}.mobilemenu{display:none}
@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto;gap:4px;padding:8px}.side-label{display:none}.nav{white-space:nowrap;width:auto}.stats{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.welcome{flex-direction:column}.topbar{padding:0 16px}.shell{padding:0 15px 40px}.loginwrap{grid-template-columns:1fr;margin:20px auto}.loginhero{padding:10px}.loginhero h1{font-size:34px}}
@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.filters,.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}.clinic{grid-template-columns:42px 1fr}.clinic .actions{grid-column:2}.clinic-icon{width:40px;height:40px}.topright .muted{display:none}}
</style></head>
<body><div id="app"></div>
<script>
(()=>{
const KEY='mentcare_demo_v1';
const today=()=>new Date().toISOString().slice(0,10);const plus=(n)=>{let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};const uid=()=>Math.random().toString(36).slice(2,10);const moneyDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'—';
const seed={users:[{id:'p1',role:'patient',name:'Mariana Costa',cpf:'52998224725',birth:'1998-04-12',email:'mariana@email.com',insurance:'Unimed',city:'Taboão da Serra'},{id:'d1',role:'professional',name:'Ana Oliveira',email:'ana@mentcare.com',specialty:'Psicologia',clinicId:'c1',city:'Taboão da Serra'},{id:'d2',role:'professional',name:'Rafael Lima',email:'rafael@mentcare.com',specialty:'Psiquiatria',clinicId:'c2',city:'São Paulo'},{id:'m1',role:'manager',name:'Gestão Clínica Bem Viver',email:'gestao@mentcare.com',clinicId:'c1'}],clinics:[{id:'c1',name:'Clínica Bem Viver',city:'Taboão da Serra',address:'Rua das Flores, 120 — Centro',insurance:['Unimed','Particular'],modes:['Presencial'],specialties:['Psicologia','Psiquiatria'],approved:true},{id:'c2',name:'Instituto Horizonte',city:'São Paulo',address:'Av. Paulista, 900 — Bela Vista',insurance:['SUS','Particular','Bradesco Saúde'],modes:['Presencial','Online'],specialties:['Psiquiatria','Psicologia'],approved:true},{id:'c3',name:'Espaço Acolher',city:'Taboão da Serra',address:'Rua do Parque, 45 — Jardim Maria Rosa',insurance:['SUS','Unimed'],modes:['Presencial'],specialties:['Psicologia'],approved:true}],availability:[{id:'a1',professionalId:'d1',date:plus(1),time:'14:00'},{id:'a2',professionalId:'d1',date:plus(2),time:'10:00'},{id:'a3',professionalId:'d1',date:plus(4),time:'15:00'},{id:'a4',professionalId:'d2',date:plus(1),time:'09:00'},{id:'a5',professionalId:'d2',date:plus(3),time:'11:00'}],appointments:[{id:'ap1',patientId:'p1',professionalId:'d1',clinicId:'c1',date:plus(1),time:'14:00',status:'Agendada',createdAt:today()}],records:[],ratings:[]};
let db=load(),current=null,page='home',modal=null,loginTab='login',notice='';function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{return structuredClone(seed)}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function user(id){return db.users.find(x=>x.id===id)}function clinic(id){return db.clinics.find(x=>x.id===id)}function prof(id){return user(id)}function appts(){return db.appointments.filter(a=>current?.role==='patient'?a.patientId===current.id:current?.role==='professional'?a.professionalId===current.id:current?.role==='manager'?a.clinicId===current.clinicId:true)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function cpfValid(c){c=(c||'').replace(/\D/g,'');if(c.length!==11||/^([0-9])\1+$/.test(c))return false;let sum=0;for(let i=0;i<9;i++)sum+=+c[i]*(10-i);let d=(sum*10)%11;if(d===10)d=0;if(d!==+c[9])return false;sum=0;for(let i=0;i<10;i++)sum+=+c[i]*(11-i);d=(sum*10)%11;if(d===10)d=0;return d===+c[10]}
function setPage(p){page=p;modal=null;render()}function toast(t){notice=t;render();setTimeout(()=>{notice='';let n=document.querySelector('.toast');if(n)n.remove()},2600)}function shell(content){let menus=current.role==='patient'?[['home','⌂','Visão geral'],['search','⌕','Buscar clínicas'],['appointments','▣','Minhas consultas'],['records','▤','Meu prontuário']]:current.role==='professional'?[['home','⌂','Visão geral'],['agenda','▦','Minha agenda'],['records','▤','Prontuários']]:[['home','⌂','Visão geral'],['clinic','✚','Minha clínica'],['professionals','♙','Profissionais']];return `<header class="topbar"><div class="brand"><div class="logo">✳</div>MentCare</div><div class="topright"><span class="muted">${esc(current.name)}</span><span class="pill">${roleName(current.role)}</span><button class="btn ghost small" onclick="logout()">Sair</button></div></header><main class="shell"><div class="layout"><aside class="sidebar"><div class="side-label">Menu principal</div>${menus.map(([id,ic,t])=>`<button class="nav ${page===id?'active':''}" onclick="setPage('${id}')"><span>${ic}</span>${t}</button>`).join('')}<div class="side-label" style="margin-top:15px">Conta de demonstração</div><button class="nav" onclick="setPage('profile')"><span>◎</span>Meu perfil</button><button class="nav" onclick="resetDemo()"><span>↻</span>Reiniciar dados</button></aside><section class="content">${notice?`<div class="notice toast">${esc(notice)}</div>`:''}${content}<div class="footer">MentCare · Protótipo acadêmico V1 · Dados demonstrativos armazenados neste navegador</div></section></div></main>`}
function roleName(r){return r==='patient'?'Paciente':r==='professional'?'Profissional':'Gestor'}function heading(title,sub,action=''){return `<div class="welcome"><div><div class="eyebrow">MentCare / ${roleName(current.role)}</div><h1>${title}</h1><div class="muted">${sub}</div></div>${action}</div>`}function stat(label,val,ico){return `<div class="stat"><span class="stat-icon">${ico}</span><small>${label}</small><strong>${val}</strong></div>`}function status(s){return `<span class="pill ${s==='Realizada'?'green':s==='Cancelada'?'red':'amber'}">${s}</span>`}
function patientHome(){let a=appts().filter(x=>x.status==='Agendada').sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));let done=appts().filter(x=>x.status==='Realizada').length;let reminders=a.filter(x=>x.date===plus(1));return heading(`Olá, ${esc(current.name.split(' ')[0])} 👋`,'Seu cuidado merece espaço na rotina. Vamos dar o próximo passo?',`<button class="btn" onclick="setPage('search')">+ Agendar consulta</button>`)+`<div class="grid stats">${stat('Próximas consultas',a.length,'▣')}${stat('Consultas realizadas',done,'✓')}${stat('Registros no prontuário',db.records.filter(r=>r.patientId===current.id).length,'▤')}</div>${reminders.length?`<div class="notice">🔔 <b>Lembrete demonstrativo:</b> você tem ${reminders.length} consulta(s) amanhã. O envio real de e-mail ficará para a V2.</div>`:''}<div class="grid two"><div class="card"><h2>Próximas consultas</h2>${a.length?a.slice(0,3).map(x=>appointmentCard(x)).join(''):`<div class="empty"><b>Nenhuma consulta agendada</b>Encontre uma clínica e escolha seu horário.</div>`}</div><div class="card"><h2>Encontre atendimento</h2><p class="muted">Busque profissionais de psicologia e psiquiatria por cidade e convênio.</p><div class="notice">Seu convênio cadastrado: <b>${esc(current.insurance||'Não informado')}</b></div><button class="btn" onclick="setPage('search')">Buscar clínicas</button></div></div>`}
function appointmentCard(a){return `<div class="item"><div class="row"><b>${esc(clinic(a.clinicId)?.name||'Clínica')}</b>${status(a.status)}</div><div class="muted">${esc(prof(a.professionalId)?.name||'Profissional')} · ${esc(prof(a.professionalId)?.specialty||'')}</div><div style="margin-top:7px">📅 ${moneyDate(a.date)} às ${a.time}</div><div class="actions" style="margin-top:10px"><button class="btn secondary small" onclick="viewAppointment('${a.id}')">Detalhes</button>${a.status==='Agendada'&&current.role==='patient'?`<button class="btn ghost small" onclick="cancelAppt('${a.id}')">Cancelar / remarcar</button>`:''}</div></div>`}
function searchPage(){let q=window.searchQ||'',city=window.searchCity||current.city||'',ins=window.searchIns??(current.insurance||'Todos'),spec=window.searchSpec||'Todas';let list=db.clinics.filter(c=>c.approved&&(!q||c.name.toLowerCase().includes(q.toLowerCase()))&&(!city||c.city.toLowerCase().includes(city.toLowerCase()))&&(ins==='Todos'||c.insurance.includes(ins))&&(spec==='Todas'||c.specialties.includes(spec))).sort((a,b)=>average(b.id)-average(a.id));return heading('Encontre seu atendimento','Clínicas e profissionais que combinam com o que você precisa.')+`<div class="card"><div class="filters"><div class="field"><label>Nome da clínica</label><input id="sq" placeholder="Buscar clínica..." value="${esc(q)}"></div><div class="field"><label>Cidade</label><input id="sc" placeholder="Todas as cidades" value="${esc(city)}"></div><div class="field"><label>Convênio / modalidade</label><select id="si">${['Todos','Unimed','Bradesco Saúde','Particular','SUS'].map(x=>`<option ${x===ins?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Especialidade</label><select id="ss">${['Todas','Psicologia','Psiquiatria'].map(x=>`<option ${x===spec?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="row"><span class="muted">${list.length} clínica(s) encontrada(s)</span><button class="btn secondary small" onclick="applySearch()">Aplicar filtros</button></div>${list.length?list.map(c=>{let avg=average(c.id);return `<div class="clinic"><div class="clinic-icon">✚</div><div><div class="row" style="justify-content:flex-start;flex-wrap:wrap"><h3>${esc(c.name)}</h3>${avg?`<span class="stars">★ ${avg.toFixed(1)}</span>`:`<span class="muted">Sem avaliações</span>`}</div><div class="clinic-meta">📍 ${esc(c.address)} · ${esc(c.city)}</div><div class="clinic-meta">Especialidades: ${c.specialties.join(', ')}</div><div class="clinic-meta">Aceita: ${c.insurance.join(' · ')}</div></div><div class="actions"><button class="btn small" onclick="bookClinic('${c.id}')">Ver horários</button></div></div>`}).join(''):`<div class="empty"><b>Nenhuma clínica encontrada</b>Tente remover ou alterar os filtros.</div>`}</div>`}
function applySearch(){window.searchQ=document.getElementById('sq').value;window.searchCity=document.getElementById('sc').value;window.searchIns=document.getElementById('si').value;window.searchSpec=document.getElementById('ss').value;render()}
function average(id){let a=db.ratings.filter(r=>r.clinicId===id);return a.length?a.reduce((s,r)=>s+r.stars,0)/a.length:0}
function appointmentsPage(){let list=appts().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));return heading('Minhas consultas','Acompanhe seus agendamentos e o histórico de atendimentos.')+`<div class="card"><h2>Histórico de consultas</h2>${list.length?list.map(appointmentCard).join(''):`<div class="empty">Você ainda não possui consultas.</div>`}</div>`}
function recordsPage(){let rows=current.role==='patient'?db.records.filter(r=>r.patientId===current.id):db.records.filter(r=>db.appointments.some(a=>a.id===r.appointmentId&&a.professionalId===current.id));return heading(current.role==='patient'?'Meu prontuário':'Prontuários dos meus pacientes','Registros de acompanhamento e evolução das sessões.')+`<div class="warning">Informações demonstrativas. Em produção, prontuários exigem controle de acesso, criptografia, auditoria e infraestrutura compatível com a LGPD.</div><div class="card"><h2>Histórico de evoluções</h2>${rows.length?rows.sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<div class="item"><div class="row"><b>${moneyDate(r.date)} · ${esc(user(r.professionalId)?.name||'Profissional')}</b><span class="pill green">Registro salvo</span></div><div class="muted">Paciente: ${esc(user(r.patientId)?.name||'')}</div><p>${esc(r.text)}</p>${r.hypothesis?`<div class="clinic-meta">Hipótese diagnóstica informada: ${esc(r.hypothesis)}</div>`:''}${(r.addenda||[]).map(ad=>`<div class="notice"><b>Adendo · ${moneyDate(ad.date)}</b><br>${esc(ad.text)}</div>`).join('')}${current.role==='professional'?`<button class="btn secondary small" onclick="addendum('${r.id}')">Adicionar adendo</button>`:''}</div>`).join(''):`<div class="empty"><b>Nenhum registro disponível</b>Os registros aparecerão aqui após as sessões.</div>`}</div>`}
function agendaPage(){let list=appts().filter(a=>a.status!=='Cancelada').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return heading('Minha agenda','Consultas agendadas e atendimentos do seu consultório.')+`<div class="card"><h2>Agenda de atendimentos</h2>${list.length?`<table class="table"><thead><tr><th>Data</th><th>Paciente</th><th>Horário</th><th>Última evolução</th><th>Status</th><th>Ação</th></tr></thead><tbody>${list.map(a=>`<tr><td>${moneyDate(a.date)}</td><td>${esc(user(a.patientId)?.name||'')}</td><td>${a.time}</td><td>${esc((db.records.filter(r=>r.patientId===a.patientId).sort((x,y)=>y.date.localeCompare(x.date))[0]?.text||'—').slice(0,65))}</td><td>${status(a.status)}</td><td>${a.status==='Agendada'?`<button class="btn small" onclick="recordSession('${a.id}')">Registrar evolução</button>`:`<button class="btn secondary small" onclick="patientRecord('${a.patientId}')">Ver prontuário</button>`}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">Sua agenda está vazia.</div>`}</div>`}
function clinicPage(){let c=clinic(current.clinicId);if(!c)return heading('Minha clínica','Cadastre os dados do estabelecimento.')+`<div class="card"><button class="btn" onclick="clinicForm()">Cadastrar clínica</button></div>`;return heading('Minha clínica','Gerencie os dados exibidos na busca de pacientes.',`<button class="btn" onclick="clinicForm('${c.id}')">Editar clínica</button>`)+`<div class="card"><h2>${esc(c.name)}</h2><p>${esc(c.address)} · ${esc(c.city)}</p><p><b>Convênios:</b> ${c.insurance.join(', ')}</p><p><b>Especialidades:</b> ${c.specialties.join(', ')}</p><p><b>Visibilidade:</b> ${c.approved?'Aprovada / visível na busca':'Pendente'}</p></div>`}
function professionalsPage(){let list=db.users.filter(u=>u.role==='professional'&&u.clinicId===current.clinicId);return heading('Profissionais','Cadastre e gerencie os profissionais vinculados à clínica.',`<button class="btn" onclick="professionalForm()">+ Adicionar profissional</button>`)+`<div class="card">${list.length?list.map(p=>`<div class="item row"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.specialty)} · ${esc(p.email)}</div></div><button class="btn secondary small" onclick="availabilityForm('${p.id}')">Disponibilidade</button></div>`).join(''):`<div class="empty">Nenhum profissional cadastrado.</div>`}</div>`}
function profilePage(){return heading('Meu perfil','Confira seus dados de cadastro.')+`<div class="card"><p><b>Nome:</b> ${esc(current.name)}</p><p><b>E-mail:</b> ${esc(current.email)}</p><p><b>Perfil:</b> ${roleName(current.role)}</p>${current.role==='patient'?`<p><b>CPF:</b> ${esc(current.cpf||'—')}</p><p><b>Convênio:</b> ${esc(current.insurance||'Não informado')}</p><p><b>Cidade:</b> ${esc(current.city||'—')}</p>`:''}</div>`}
function home(){return current.role==='patient'?patientHome():current.role==='professional'?heading(`Olá, ${esc(current.name.split(' ')[0])}`,'Acompanhe sua agenda e os registros dos pacientes.')+`<div class="grid stats">${stat('Consultas agendadas',appts().filter(a=>a.status==='Agendada').length,'▣')}${stat('Realizadas',appts().filter(a=>a.status==='Realizada').length,'✓')}${stat('Pacientes',new Set(appts().map(a=>a.patientId)).size,'♙')}</div><div class="card"><h2>Próximos atendimentos</h2>${appts().filter(a=>a.status==='Agendada').slice(0,4).map(appointmentCard).join('')||'<div class="empty">Nenhuma consulta próxima.</div>'}<button class="btn secondary" onclick="setPage('agenda')">Abrir agenda</button></div>`:heading('Painel da clínica','Gerencie profissionais, dados do estabelecimento e atendimentos.')+`<div class="grid stats">${stat('Profissionais',db.users.filter(u=>u.role==='professional'&&u.clinicId===current.clinicId).length,'♙')}${stat('Consultas',appts().length,'▣')}${stat('Avaliação média',average(current.clinicId).toFixed(1),'★')}</div><div class="card"><h2>Acesso rápido</h2><div class="actions"><button class="btn" onclick="setPage('clinic')">Editar clínica</button><button class="btn secondary" onclick="setPage('professionals')">Gerenciar profissionais</button></div></div>`}
function render(){if(!current){document.getElementById('app').innerHTML=login();return}let html=page==='home'?home():page==='search'?searchPage():page==='appointments'?appointmentsPage():page==='records'?recordsPage():page==='agenda'?agendaPage():page==='clinic'?clinicPage():page==='professionals'?professionalsPage():profilePage();document.getElementById('app').innerHTML=shell(html)+(modal?modal:'')}
function login(){return `<header class="topbar"><div class="brand"><div class="logo">✳</div>MentCare</div><span class="muted">Plataforma de cuidado e acompanhamento</span></header><main class="loginwrap"><div class="loginhero"><div class="eyebrow">Cuidado que conecta</div><h1>Sua saúde mental merece atenção.</h1><p class="muted">Encontre clínicas, agende consultas e acompanhe sua jornada de cuidado em um só lugar.</p><div class="notice">Protótipo acadêmico com dados fictícios. Não insira informações reais de saúde.</div></div><div class="loginpanel"><div class="tabs"><button class="tab ${loginTab==='login'?'active':''}" onclick="setLoginTab('login')">Entrar</button><button class="tab ${loginTab==='register'?'active':''}" onclick="setLoginTab('register')">Criar conta</button></div>${loginTab==='login'?`<h2>Bem-vindo de volta</h2><p class="muted">Entre para continuar seu acompanhamento.</p><form onsubmit="doLogin(event)"><div class="field"><label>E-mail</label><input id="email" type="email" required placeholder="voce@email.com"></div><div class="field"><label>Senha</label><input id="password" type="password" required placeholder="Sua senha"></div><div class="field"><label>Perfil de acesso</label><select id="role"><option value="patient">Paciente</option><option value="professional">Profissional</option><option value="manager">Gestor da clínica</option></select></div><button class="btn" style="width:100%">Entrar na plataforma</button></form><div class="notice"><b>Acesso rápido para demonstração</b><br>Contas de demonstração usam a senha <b>mentcare123</b>. Contas criadas por você validam a senha cadastrada.</div><div class="muted" style="font-size:12px">Paciente: mariana@email.com<br>Profissional: ana@mentcare.com<br>Gestor: gestao@mentcare.com<br>Senha: mentcare123</div>`:`<h2>Crie sua conta</h2><p class="muted">Cadastro para pacientes.</p><form onsubmit="register(event)"><div class="field"><label>Nome completo</label><input id="rn" required></div><div class="formgrid"><div class="field"><label>CPF</label><input id="rc" maxlength="14" placeholder="000.000.000-00" required></div><div class="field"><label>Data de nascimento</label><input id="rb" type="date" required></div><div class="field"><label>E-mail</label><input id="re" type="email" required></div><div class="field"><label>Senha (mínimo 8 caracteres)</label><input id="rp" type="password" minlength="8" required></div><div class="field"><label>Convênio</label><select id="ri"><option>Particular</option><option>SUS</option><option>Unimed</option><option>Bradesco Saúde</option></select></div><div class="field"><label>Cidade</label><input id="rcity" value="Taboão da Serra" required></div></div><button class="btn" style="width:100%">Criar conta</button></form><div class="footer">Ao continuar, você concorda com o uso demonstrativo dos dados neste navegador.</div>`}</div></main>`}
window.doLogin=async e=>{e.preventDefault();let em=document.getElementById('email').value.toLowerCase(),role=document.getElementById('role').value,pw=document.getElementById('password').value;current=db.users.find(u=>u.email.toLowerCase()===em&&u.role===role);if(!current){alert('Perfil não encontrado. Confira o e-mail ou crie uma conta de paciente.');return}if(current.passHash){if(!(await checkPassword(pw,current.passHash))){alert('Senha incorreta.');current=null;return}}else if(pw!=='mentcare123'){alert('Para as contas de demonstração, use a senha mentcare123.');current=null;return}page='home';render()};window.logout=()=>{current=null;page='home';render()};window.loginTab=loginTab;window.setLoginTab=t=>{loginTab=t;render()};
async function hashPassword(value){const bytes=new TextEncoder().encode(value);const digest=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('')}function checkPassword(value,hash){return hashPassword(value).then(v=>v===hash)}
window.register=async e=>{e.preventDefault();let cpf=document.getElementById('rc').value.replace(/\D/g,''),email=document.getElementById('re').value.toLowerCase(),pass=document.getElementById('rp').value;if(!cpfValid(cpf)){alert('CPF inválido. Confira os números informados.');return}if(db.users.some(u=>u.cpf===cpf||u.email.toLowerCase()===email)){alert('CPF ou e-mail já cadastrado.');return}if(pass.length<8){alert('A senha precisa ter ao menos 8 caracteres.');return}let u={id:uid(),role:'patient',name:document.getElementById('rn').value,cpf,birth:document.getElementById('rb').value,email,insurance:document.getElementById('ri').value,city:document.getElementById('rcity').value,passHash:await hashPassword(pass)};db.users.push(u);save();current=u;page='home';render()};
window.setPage=setPage;window.applySearch=applySearch;window.resetDemo=()=>{if(confirm('Apagar os dados deste protótipo e restaurar a demonstração?')){db=structuredClone(seed);save();page='home';render()}};
window.bookClinic=id=>{let c=clinic(id),ps=db.users.filter(u=>u.role==='professional'&&u.clinicId===id);modal=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row"><h2>Agendar consulta</h2><button class="btn ghost small" onclick="closeModal()">✕</button></div><p class="muted">${esc(c.name)} · ${esc(c.city)}</p><form onsubmit="confirmBooking(event,'${id}')"><div class="field"><label>Profissional</label><select id="bp" required>${ps.map(p=>`<option value="${p.id}">${esc(p.name)} — ${esc(p.specialty)}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>Data disponível</label><select id="bd" required></select></div><div class="field"><label>Horário</label><select id="bt" required></select></div></div><div class="notice">São exibidos horários disponíveis dos próximos 30 dias. Nenhum pagamento é realizado pela plataforma.</div><div class="modalfoot"><button type="button" class="btn ghost" onclick="closeModal()">Voltar</button><button class="btn">Confirmar agendamento</button></div></form></div></div>`;render();fillSlots()};
function fillSlots(){let p=document.getElementById('bp');if(!p)return;let refresh=()=>{let slots=db.availability.filter(s=>s.professionalId===p.value&&s.date>=today()&&s.date<=plus(30)&&!db.appointments.some(a=>a.date===s.date&&a.time===s.time&&a.professionalId===s.professionalId&&a.status!=='Cancelada')).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));let d=document.getElementById('bd'),t=document.getElementById('bt');d.innerHTML=[...new Set(slots.map(s=>s.date))].map(x=>`<option value="${x}">${moneyDate(x)}</option>`).join('');let times=slots.filter(s=>s.date===d.value);t.innerHTML=times.map(s=>`<option value="${s.time}">${s.time}</option>`).join('');if(!slots.length){d.innerHTML='<option value="">Sem horários livres</option>';t.innerHTML=''} };p.onchange=refresh;document.getElementById('bd').onchange=refresh;refresh()}
window.confirmBooking=(e,id)=>{e.preventDefault();let professionalId=document.getElementById('bp').value,date=document.getElementById('bd').value,time=document.getElementById('bt').value;if(!date){alert('Não há horários livres para este profissional.');return}if(date<today()){alert('Não é possível agendar no passado.');return}if(db.appointments.some(a=>a.patientId===current.id&&a.date===date&&a.time===time&&a.status==='Agendada')){alert('Você já possui uma consulta neste horário.');return}if(db.appointments.some(a=>a.professionalId===professionalId&&a.date===date&&a.time===time&&a.status!=='Cancelada')){alert('Este horário acabou de ser reservado. Escolha outro.');return}db.appointments.push({id:uid(),patientId:current.id,professionalId,clinicId:id,date,time,status:'Agendada',createdAt:today()});save();page='appointments';modal=null;toast('Consulta agendada com sucesso!')};
window.closeModal=()=>{modal=null;render()};window.viewAppointment=id=>{let a=db.appointments.find(x=>x.id===id);modal=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row"><h2>Detalhes da consulta</h2><button class="btn ghost small" onclick="closeModal()">✕</button></div><p><b>Clínica:</b> ${esc(clinic(a.clinicId)?.name)}</p><p><b>Profissional:</b> ${esc(prof(a.professionalId)?.name)}</p><p><b>Data:</b> ${moneyDate(a.date)} às ${a.time}</p><p><b>Status:</b> ${status(a.status)}</p>${a.status==='Realizada'&&current.role==='patient'&&!db.ratings.some(r=>r.appointmentId===a.id)?`<button class="btn" onclick="rateClinic('${a.id}')">Avaliar clínica</button>`:''}</div></div>`;render()};
window.cancelAppt=id=>{let a=db.appointments.find(x=>x.id===id),dateTime=new Date(a.date+'T'+a.time),hours=(dateTime-new Date())/36e5;if(hours<24){alert('A política definida na Issue permite cancelamento/remarcação com pelo menos 24 horas de antecedência. Para este protótipo, a alteração dentro das 24h fica bloqueada e deve ser tratada diretamente com a clínica.');return}modal=`<div class="modalback"><div class="modal"><h2>Cancelar ou remarcar</h2><p>O que deseja fazer com a consulta de ${moneyDate(a.date)} às ${a.time}?</p><div class="actions"><button class="btn danger" onclick="doCancel('${id}')">Cancelar consulta</button><button class="btn secondary" onclick="reschedule('${id}')">Remarcar</button><button class="btn ghost" onclick="closeModal()">Voltar</button></div></div></div>`;render()};window.doCancel=id=>{let a=db.appointments.find(x=>x.id===id);a.status='Cancelada';save();page='appointments';toast('Consulta cancelada; horário liberado.')};
window.reschedule=id=>{let a=db.appointments.find(x=>x.id===id);let slots=db.availability.filter(s=>s.professionalId===a.professionalId&&s.date>=today()&&s.date<=plus(30)&&!db.appointments.some(x=>x.id!==id&&x.professionalId===s.professionalId&&x.date===s.date&&x.time===s.time&&x.status!=='Cancelada'));modal=`<div class="modalback"><div class="modal"><h2>Remarcar consulta</h2><form onsubmit="doReschedule(event,'${id}')"><div class="field"><label>Novo horário</label><select id="newslot">${slots.map(s=>`<option value="${s.id}">${moneyDate(s.date)} às ${s.time}</option>`).join('')}</select></div><div class="modalfoot"><button type="button" class="btn ghost" onclick="closeModal()">Voltar</button><button class="btn">Confirmar</button></div></form></div></div>`;render()};window.doReschedule=(e,id)=>{e.preventDefault();let a=db.appointments.find(x=>x.id===id),s=db.availability.find(x=>x.id===document.getElementById('newslot').value);if(!s){alert('Nenhum horário disponível.');return}a.date=s.date;a.time=s.time;save();page='appointments';toast('Consulta remarcada!')};
window.recordSession=id=>{let a=db.appointments.find(x=>x.id===id);modal=`<div class="modalback"><div class="modal"><h2>Registrar evolução da sessão</h2><p class="muted">Paciente: ${esc(user(a.patientId)?.name)} · ${moneyDate(a.date)}</p><form onsubmit="saveRecord(event,'${id}')"><div class="field"><label>Evolução / observações clínicas</label><textarea id="rt" required placeholder="Registre a evolução do atendimento..."></textarea></div><div class="field"><label>Hipótese diagnóstica (opcional)</label><input id="rh"></div><div class="warning">Após salvar, o registro original não poderá ser apagado ou editado. Correções futuras devem ser feitas por adendo datado.</div><div class="modalfoot"><button type="button" class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn">Salvar registro</button></div></form></div></div>`;render()};window.saveRecord=(e,id)=>{e.preventDefault();let a=db.appointments.find(x=>x.id===id);if(a.professionalId!==current.id){alert('Apenas o profissional responsável pode registrar a evolução.');return}db.records.push({id:uid(),appointmentId:id,patientId:a.patientId,professionalId:current.id,date:today(),text:document.getElementById('rt').value,hypothesis:document.getElementById('rh').value,addenda:[]});a.status='Realizada';save();page='agenda';toast('Evolução registrada e consulta marcada como realizada.')};
window.addendum=id=>{modal=`<div class="modalback"><div class="modal"><h2>Adicionar adendo</h2><form onsubmit="saveAddendum(event,'${id}')"><div class="field"><label>Complemento datado</label><textarea id="adt" required></textarea></div><div class="modalfoot"><button type="button" class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn">Salvar adendo</button></div></form></div></div>`;render()};window.saveAddendum=(e,id)=>{e.preventDefault();let r=db.records.find(x=>x.id===id);r.addenda.push({date:today(),text:document.getElementById('adt').value});save();page='records';toast('Adendo incluído no prontuário.')};
window.patientRecord=id=>{page='records';render()};window.rateClinic=id=>{let a=db.appointments.find(x=>x.id===id);modal=`<div class="modalback"><div class="modal"><h2>Avaliar atendimento</h2><form onsubmit="saveRating(event,'${id}')"><div class="field"><label>Sua nota (1 a 5 estrelas)</label><select id="stars"><option value="5">5 — Excelente</option><option value="4">4 — Muito bom</option><option value="3">3 — Bom</option><option value="2">2 — Regular</option><option value="1">1 — Ruim</option></select></div><div class="field"><label>Comentário (opcional)</label><textarea id="comment"></textarea></div><div class="modalfoot"><button type="button" class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn">Enviar avaliação</button></div></form></div></div>`;render()};window.saveRating=(e,id)=>{e.preventDefault();let a=db.appointments.find(x=>x.id===id);if(a.status!=='Realizada'){alert('Somente consultas realizadas podem ser avaliadas.');return}db.ratings.push({id:uid(),appointmentId:id,clinicId:a.clinicId,patientId:current.id,stars:+document.getElementById('stars').value,comment:document.getElementById('comment').value});save();modal=null;page='appointments';toast('Obrigado pela avaliação!')};
window.clinicForm=id=>{let c=clinic(id)||{};modal=`<div class="modalback"><div class="modal"><h2>${id?'Editar':'Cadastrar'} clínica</h2><form onsubmit="saveClinic(event,'${id||''}')"><div class="field"><label>Nome da clínica</label><input id="cn" value="${esc(c.name||'')}" required></div><div class="formgrid"><div class="field"><label>Cidade</label><input id="cc" value="${esc(c.city||'')}" required></div><div class="field"><label>Endereço</label><input id="ca" value="${esc(c.address||'')}" required></div><div class="field wide"><label>Convênios aceitos (separe por vírgula)</label><input id="ci" value="${esc((c.insurance||[]).join(', '))}" placeholder="Unimed, SUS, Particular"></div><div class="field wide"><label>Especialidades (separe por vírgula)</label><input id="cs" value="${esc((c.specialties||['Psicologia']).join(', '))}"></div></div><div class="notice">Nesta V1, clínicas cadastradas pelo gestor ficam visíveis imediatamente. Fluxo de aprovação administrativa pode ser incluído na V2.</div><div class="modalfoot"><button type="button" class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn">Salvar clínica</button></div></form></div></div>`;render()};window.saveClinic=(e,id)=>{e.preventDefault();let obj={id:id||uid(),name:document.getElementById('cn').value,city:document.getElementById('cc').value,address:document.getElementById('ca').value,insurance:document.getElementById('ci').value.split(',').map(x=>x.trim()).filter(Boolean),specialties:document.getElementById('cs').value.split(',').map(x=>x.trim()).filter(Boolean),approved:true,modes:['Presencial']};if(id)Object.assign(clinic(id),obj);else{db.clinics.push(obj);current.clinicId=obj.id}save();modal=null;page='clinic';toast('Dados da clínica salvos.')};
window.professionalForm=()=>{modal=`<div class="modalback"><div class="modal"><h2>Adicionar profissional</h2><form onsubmit="saveProfessional(event)"><div class="field"><label>Nome completo</label><input id="pn" required></div><div class="field"><label>E-mail</label><input id="pe" type="email" required></div><div class="field"><label>Especialidade</label><select id="ps"><option>Psicologia</option><option>Psiquiatria</option></select></div><div class="modalfoot"><button type="button" class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn">Cadastrar</button></div></form></div></div>`;render()};window.saveProfessional=e=>{e.preventDefault();let email=document.getElementById('pe').value;if(db.users.some(u=>u.email.toLowerCase()===email.toLowerCase())){alert('Este e-mail já está cadastrado.');return}db.users.push({id:uid(),role:'professional',name:document.getElementById('pn').value,email,specialty:document.getElementById('ps').value,clinicId:current.clinicId});save();modal=null;page='professionals';toast('Profissional cadastrado.')};
window.availabilityForm=id=>{let p=user(id),slots=db.availability.filter(s=>s.professionalId===id);modal=`<div class="modalback"><div class="modal"><h2>Disponibilidade — ${esc(p.name)}</h2><div class="field"><label>Adicionar data</label><input type="date" id="avd" min="${today()}" max="${plus(90)}"></div><div class="field"><label>Horário</label><input type="time" id="avt" value="09:00"></div><button class="btn" onclick="addAvailability('${id}')">Adicionar horário</button><h3 style="margin-top:20px">Horários cadastrados</h3>${slots.map(s=>`<div class="row item"><span>${moneyDate(s.date)} às ${s.time}</span><button class="btn danger small" onclick="removeAvailability('${s.id}','${id}')">Remover</button></div>`).join('')||'<p class="muted">Nenhum horário cadastrado.</p>'}<div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Fechar</button></div></div></div>`;render()};window.addAvailability=id=>{let date=document.getElementById('avd').value,time=document.getElementById('avt').value;if(!date||!time||date<today()){alert('Informe uma data futura e um horário válido.');return}if(db.availability.some(s=>s.professionalId===id&&s.date===date&&s.time===time)){alert('Este horário já foi cadastrado.');return}db.availability.push({id:uid(),professionalId:id,date,time});save();availabilityForm(id)};window.removeAvailability=(sid,id)=>{if(db.appointments.some(a=>db.availability.find(s=>s.id===sid)?.date===a.date&&db.availability.find(s=>s.id===sid)?.time===a.time&&a.status==='Agendada')){alert('Este horário possui uma consulta agendada e não pode ser removido.');return}db.availability=db.availability.filter(s=>s.id!==sid);save();availabilityForm(id)};
// Expose state navigation and bootstrap
render();
})();
</script></body></html>
